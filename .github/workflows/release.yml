name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # The locked packages (Symfony 8) need PHP 8.4 or newer, which is what production runs.
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check that the tag matches style.css
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          STYLE_VERSION="$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -1 | tr -d '[:space:]')"
          if [ "$STYLE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match style.css version $STYLE_VERSION" >&2
            exit 1
          fi

      - name: Build the release zip
        # The same script that a person runs on a laptop. It copies the real theme folders,
        # installs production dependencies, builds the assets, checks the file list, and zips.
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: bin/package.sh --out dist --version "$TAG_VERSION" --list

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" HEAD~10..HEAD)
          fi

          # Write to file for multiline output
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/crispytheme-v2-${{ steps.get_version.outputs.version }}.zip
          body_path: changelog.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispytheme-v2-${{ steps.get_version.outputs.version }}
          path: dist/crispytheme-v2-${{ steps.get_version.outputs.version }}.zip
          retention-days: 30

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## Release v${{ steps.get_version.outputs.version }} Published! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release has been created and the theme zip is available for download." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
